name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      UV_PROJECT_ENVIRONMENT: .venv
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnuradio python3-soapysdr
      - run: uv venv --python /usr/bin/python3.12 --system-site-packages
      - run: uv sync --extra mcp
      - run: uv run mypy .
      - run: uv run pytest tests/unit tests/integration -q -n auto

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra mcp
      - uses: actions/cache@v4
        with:
          path: artifacts
          key: assets-${{ hashFiles('tests/assets.toml') }}
      - run: PYTHONPATH=tests uv run python -m helpers.assets fetch
      - run: PYTHONPATH=tests uv run python -m helpers.assets verify

  e2e:
    needs: assets
    runs-on: ubuntu-latest
    env:
      UV_PROJECT_ENVIRONMENT: .venv
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnuradio python3-soapysdr
      - run: uv venv --python /usr/bin/python3.12 --system-site-packages
      - run: uv sync --extra mcp
      - uses: actions/cache@v4
        with:
          path: artifacts
          key: assets-${{ hashFiles('tests/assets.toml') }}
      - run: PYTHONPATH=tests uv run python -m helpers.assets fetch
      - run: MARCONI_ASSETS_STRICT=1 uv run pytest tests/e2e
