repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: debug-statements
    -   id: name-tests-test
        args: [--pytest-test-first]
        exclude: '^tests/.*/(make_|_).+\.py$|^tests/helpers/(bitops|blockmath|crc|css_explicit|framing|golay|hardware|parse|rds)\.py$'
-   repo: https://github.com/pycqa/isort
    rev: 7.0.0
    hooks:
      - id: isort
        name: isort (python)
-   repo: https://github.com/psf/black
    rev: 25.12.0
    hooks:
    -   id: black
-   repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
    -   id: flake8
-   repo: local
    hooks:
    -   id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        pass_filenames: false
        always_run: true
    -   id: pytest
        name: pytest (unit + integration)
        entry: uv run pytest tests/unit tests/integration -q -n auto
        language: system
        pass_filenames: false
        always_run: true
