[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marconi"
version = "0.1.0"
description = "LLM-driven RF control and analysis — an engine-agnostic operations layer with a GNU Radio backend."
requires-python = ">=3.13"
dependencies = [
    "pydantic",
    "pyyaml",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "matplotlib>=3.11.0",
    "fastmcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest >= 7.0",
    "pytest-asyncio",
    "pre-commit",
]

[project.scripts]
marconi-mcp = "marconi.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# src on the path so `import marconi` resolves without an install step
pythonpath = ["src", "."]
asyncio_mode = "auto"
