[dependency-groups]
dev = ["pytest>=7.0", "pytest-asyncio", "pytest-xdist", "pre-commit", "mypy"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
marconi-core = { workspace = true }
marconi-phy = { workspace = true }
marconi-bits = { workspace = true }

[tool.isort]
profile = "black"
known_first_party = ["marconi"]

[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "packages/marconi-core/src:packages/marconi-phy/src:packages/marconi-bits/src"

[[tool.mypy.overrides]]
module = "marconi.*"
disallow_incomplete_defs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
