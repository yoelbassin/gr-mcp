[project]
name = "marconi"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "numpy>=2",
    "scipy>=1.17",
    "reedsolo>=1.7.0",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]

[project.scripts]
marconi-mcp = "marconi.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marconi"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "pytest-xdist",
    "pre-commit",
    "mypy",
    "construct>=2.10",
    "crc>=7",
    "fastmcp>=2.0",
]

[tool.isort]
profile = "black"
known_first_party = ["marconi"]

[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "marconi.*"
disallow_incomplete_defs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "hardware: exercises a physically attached SDR (auto-skipped when none present)",
]
