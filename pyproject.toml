[project]
name = "marconi"
version = "0.1.0"
description = "Receive-only LLM-driven RF: survey, identify, and decode signals to FEC-corrected bits through GNU Radio, over MCP"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Yoel Bassin" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    # <3: GNU Radio is compiled against a specific numpy ABI and the venv's
    # numpy SHADOWS the one GR was built with (the recorded incident: apt's
    # GR against numpy 1.26 under numpy>=2 aborted every import with
    # "numpy.core.multiarray failed to import"). The 2.x ceiling keeps the
    # bootstrap from installing a future-ABI numpy over today's GR builds.
    "numpy>=2,<3",
    "scipy>=1.17",
    "reedsolo>=1.7.0",
]

[project.urls]
Repository = "https://github.com/yoelbassin/gr-mcp"

[project.optional-dependencies]
# <4: fastmcp majors have broken tool-registration API before; an open range
# resolves a different major for a fresh user than the one this was built on
mcp = ["fastmcp>=2.0,<4"]

[project.scripts]
marconi-mcp = "marconi.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marconi"]

# hatchling's sdist default is "everything the repo .gitignore doesn't
# exclude", which shipped 230 files of untracked agent scaffolding and a
# local editor settings file - 1.0 MB of a 1.2 MB archive
[tool.hatch.build.targets.sdist]
include = ["src", "pyproject.toml", "README.md", "LICENSE"]

[dependency-groups]
# black/isort/flake8 match the .pre-commit-config.yaml revs: CLAUDE.md
# promises the gate and the CLI never disagree, which requires the CLI to
# exist - `uv run black .` was previously uninstallable
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "pytest-xdist",
    "pre-commit",
    "mypy",
    "black==25.12.0",
    "isort==7.0.0",
    "flake8==7.3.0",
    "construct>=2.10",
    "crc>=7",
    "fastmcp>=2.0,<4",
]

[tool.isort]
profile = "black"
known_first_party = ["marconi"]

[tool.mypy]
explicit_package_bases = true
mypy_path = "src:tests"
strict = true

# The external packages that ship no stubs and no py.typed. Named one by one so
# a newly-untyped import fails the gate instead of being absorbed by it.
[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "gnuradio.*",
    "SoapySDR",
    "reedsolo",
    "creedsolo",
    "construct",
]
ignore_missing_imports = true

# GNU Radio ships no stubs, so gr.basic_block/sync_block/top_block are Any and
# the blocks that extend them cannot satisfy disallow_subclassing_any. The
# exemption names the seam instead of weakening the whole tree.
[[tool.mypy.overrides]]
module = [
    "marconi.engine.backends.gnuradio.build",
    "marconi.engine.backends.gnuradio.embedded.*",
    "unit.engine.backends.gnuradio.*",
    "unit.engine.modulation.coding.test_fec_conv",
    "unit.engine.modulation.coding.test_sync_align",
]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "hardware: exercises a physically attached SDR (auto-skipped when none present)",
]
