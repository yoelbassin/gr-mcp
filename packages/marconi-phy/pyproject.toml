[project]
name = "marconi-phy"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["marconi-core", "numpy>=2", "scipy>=1.17", "pydantic>=2"]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marconi"]
