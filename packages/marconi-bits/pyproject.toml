[project]
name = "marconi-bits"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["marconi-core", "numpy>=2", "pydantic>=2", "construct>=2.10", "crc>=7"]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marconi"]
